<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopFun - Shopping</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- HEADER -->
  <nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand fw-bold">amazon<span style="color:#f90;">.in</span></span>

    <form class="d-flex w-50">
      <input class="form-control me-2" type="search" placeholder="Search Amazon.in">
      <button class="btn btn-warning">Search</button>
    </form>

    <div class="text-white">
      <div>Hello, Sudhir</div>
      <strong>Sign Out</strong>
    </div>
  </nav>

  <!-- MAIN -->
  <div class="container mt-4">
    <div class="row">

      <!-- PRODUCTS -->
      <div class="col-lg-9">
        <h3 class="mb-3">Products</h3>

        <div class="row g-3">

          <!-- Product Card -->
          <div class="col-md-4">
            <div class="card p-3 text-center">
              <div style="font-size:50px;">🎧</div>
              <h5>AirPods Pro</h5>
              <p>₹24,900</p>
              <button class="btn btn-warning">Add to Cart</button>
            </div>
          </div>

          <div class="col-md-4">
            <div class="card p-3 text-center">
              <div style="font-size:50px;">📺</div>
              <h5>Fire TV Stick</h5>
              <p>₹4,499</p>
              <button class="btn btn-warning">Add to Cart</button>
            </div>
          </div>

          <div class="col-md-4">
            <div class="card p-3 text-center">
              <div style="font-size:50px;">🔊</div>
              <h5>Echo Dot</h5>
              <p>₹3,499</p>
              <button class="btn btn-warning">Add to Cart</button>
            </div>
          </div>

        </div>
      </div>

      <!-- CART -->
      <div class="col-lg-3">
        <div class="card p-3">
          <h5>Cart</h5>
          <p>Your cart is empty</p>
          <button class="btn btn-warning w-100" disabled>Proceed to Buy</button>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
